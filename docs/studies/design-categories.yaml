      - "a rival crew attacks your depot at night; you hold a lantern"
      - "the queue of customers grows faster than you can serve it"
      - "a crossword setter keeps publishing something harder than last week"
      - "your own last score sits on the board as the thing to beat"
      - "a referee enforces half-remembered rules and disagrees with you"
      - "the bank forecloses in twenty turns unless the ledger balances"
      - "a rival gardener takes the village prize you wanted"
      - "the teacher marks your essay against a rubric you can read"
      - "an auditor finds exactly one error per day in your books"
      - "enemies return each night stronger, and you repair each morning"
      - "a rival translator submits the same poem before you finish"
      - "the other curator keeps moving your labels a shelf to the left"
      - "a rules-lawyer at the table audits your moves and calls fouls"
      - "the colony's rats have learned to open the pantry latch"
      - "a second player controls the weather you must build under"
      - "the timetable is the antagonist and it is never late for you"
      - "a competing band books your venue on the same night"
      - "the archive forgets one document per turn and blames you"
      - "an apprentice copies your craft and sells it one coin cheaper"
      - "the union negotiates shorter shifts while you set the rota"
      - "one player plays the bureaucracy, everyone else plays its applicants"  # heavy
