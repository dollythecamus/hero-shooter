      - "everyone plans at once, then all orders resolve together"
      - "the clock advances one minute per line of text you write"
      - "a two-minute round, then the round is scored and reset"
      - "waiting costs a coin per beat, so idling is a purchase"
      - "the week is seven moves and Sunday is a reckoning"
      - "day and night alternate, and only some work gets done in each"
      - "each turn you may rewind one thing that happened last turn"
      - "time moves only when a card is drawn from the deck"
      - "the season turns every twenty clicks and unharvested crops rot"
      - "each action costs a different number of in-fiction minutes"
      - "paused until you press play; you may queue three orders"
      - "one month passes per minute, and the year ends the session"
      - "you age a year per level and lose something each decade"
      - "two clocks run at different speeds and you must reconcile them"
      - "the shift ends when the last customer leaves, however long"
      - "one night per session; dawn ends it whether or not you finished"
      - "the calendar is the board, and events land on numbered squares"
