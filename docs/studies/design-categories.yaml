      - "succeed by refusing every reward offered"
      - "win by making a rule that others adopt"
      - "the only win is a draw both players accept"
  - id: information-model
    name: Information model
    forces: "what the player knows and what stays hidden"
    items:
      - "everything is visible, no hidden state"
      - "you see only your own hand of cards"
      - "a map that fills in as you walk"
      - "prices are known, quantities are not"
      - "each item shows its numbers plainly"
      - "the game explains every rule up front"
      - "a log records everything that happened"
      - "you see their resources but never their plans"
      - "numbers are replaced by words like few and many"  # forces: fuzziness is the information
      - "information arrives one turn late"
      - "you know the totals, never the parts"
      - "the game lies once per session, marked later"
      - "each fact belongs to one player who may share it"
      - "you see the world through a biased narrator"
      - "rules are learned only by breaking them"
      - "the interface shows only what just changed"
      - "a rumor mill invents plausible false facts"
      - "you may pay to reveal one hidden value"
      - "the state is one number you cannot decompose"
      - "everything is known except the order"
      - "you see causes but never their effects"  # wild
      - "two ledgers disagree, one of them is yours"
      - "the game remembers what you forget and hides it"  # wild
      - "information is physical, carried by heavy objects"
      - "you know the ending but not the path"
      - "the interface is a poem that must be interpreted"  # wild
      - "you must forget one fact to learn another"
      - "the state is knowable only through other players"
      - "all numbers are relative to a hidden baseline"
      - "your own inputs are shown as if they were events"
  - id: conflict-and-stakes
    name: Conflict and stakes
    forces: "who or what pushes back"
    items:
