      - "reflection-only view, player sees the arena in a mirror surface"
      - "camera is the enemy's eye, always looking at the hero from a foe"
      - "fisheye lens distortion that widens with movement speed"
      - "one continuous unbroken shot, camera never cuts across the whole match"  # heavy
      - "camera renders only what the hero remembers having seen"  # wild
      - "two cameras at once, player picks which feed to trust"  # wild
