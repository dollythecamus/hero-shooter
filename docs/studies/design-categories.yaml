      - "split screen: one camera aims, the other shows where you are"
      - "rear-view mirror panel showing what is behind the hero"
      - "camera lags one second behind the player, predicting nothing"
      - "camera lives inside the weapon barrel, muzzle as viewpoint"
      - "perspective flips to top-down whenever the player stops moving"
      - "camera height tied to health, dropping as the hero takes damage"
      - "picture-in-picture drone camera the player can steer independently"
      - "camera orbits a fixed point, player moves the world instead"
