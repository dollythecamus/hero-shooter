# design-categories.yaml - the design-roll option space, version 2 (live)
#
# v2, 2026-10-24. Generated by three parallel subagents from a de-biased brief (re-cut 20 categories starting
# from the medium and the information model, a neutral working directory outside any project, an explicit
# "no project context exists" instruction, non-combat format examples, and hard quotas the generators had to
# self-check). Validated here: 20 categories x 30 = 600 items, 0 duplicates, 0 items over 14 words, pure ASCII,
# 2 colon-template items.
#
# BIAS AUDIT (the reason v1 was rejected; see study section 10.9):
#      v1                       v2
#      combat vocabulary  26.2%  0.3%  (2 of 600 items)
#      worst category     77%    3.3%  (1 of 30)
#      art/theme/audio    0-3%   0-3%  (unchanged - they were never the problem)
#
# HOW TO CULL (Chloe): use design-categories.tsv in a spreadsheet. Set `keep` to 0, or delete the row. Delete a
# whole category block below if the dimension itself is wrong. Do not rewrite item text; if an item is nearly
# right, keep it and say so - re-wording is a later pass.
#
# TWO THINGS TO KNOW BEFORE YOU CULL:
# 1. Combat is now nearly absent (0.3%). That is your taste respected, and it is also an under-sampling of the
#    real games landscape - a "general" space would be nearer 10-20%. If you want conflict-driven designs to be
#    possible but rare, keep the two items that exist; if you want them possible at all as a real branch, say so
#    and I will add a curated handful rather than a generated set.
# 2. 22 of the 30 medium-and-material items are physical or off-screen (paper forms, receipts, cards, a cassette,
#    a scent jar, wool and pins). The loop builds software, so the feasibility veto will reject most of them at
#    roll time. They are the most interesting items in the file, so the TSV carries a `physical` column: sort on
#    it before culling, and decide whether that category is for the jam or for later human play.
#
# flags: wild = feasibility-stressing, heavy = needs more than two weeks or an engine feature,
#        forces: ... = what choosing it would force.

categories:
  - id: medium-and-material
    name: Medium and material
    forces: "what the game is physically made of"
    items:
      - "a paper form filled between rounds, the game reads the answers"  # forces: printing is the build
      - "twelve physical cards, no screen at all"
      - "a single sheet of paper folded into the board"
      - "a stack of index cards you write on before play"
      - "a plain text file the player edits to play"
      - "a printed map and a pencil, no computer"
      - "a spreadsheet where the formulas are the rules"  # forces: cells are the world model
      - "a chat window with a bot that answers in riddles"
      - "a roll of receipts stapled into a working economy"  # heavy
      - "a shoebox of found objects used as pieces"
      - "a voice memo exchange, no visuals anywhere"
      - "a printer that outputs the next turn after each choice"  # forces: output is the screen
      - "a birthday card that unfolds into a three-room house"
      - "a cassette tape whose second side rewrites the rules"
      - "a wall calendar where days are spent as resources"
      - "a tin of buttons sorted by color into factions"
      - "adding machine tape rolled out as a timeline"  # wild
      - "a recipe card photocopied and altered between sessions"
      - "a library book with a pressed-flower cipher inside"
      - "a bus timetable used as the random number table"
      - "a cardboard wheel you rotate to set difficulty"
      - "an audio tour played through one pair of headphones"
      - "a seed packet and a paper pot, growth sets the timer"  # wild
      - "a deck cut from the player's own photographs"
      - "a telegraph key tapping messages to a distant player"
      - "a mirrored card readable only in a still puddle"  # wild
      - "a paper ladder cut and taped to span two tables"
      - "a wool thread strung between pins as the map"
      - "a scent jar opened only when a rule triggers"
      - "a stack of unopened letters, each one a level"
  - id: input-grammar
    name: Input grammar
    forces: "the verbs the player is allowed to perform"
    items:
      - "type a sentence, the world understands only known verbs"
      - "click one of three buttons that never move"
      - "drag tiles into a row to form a command"
      - "hold a key down and the action grows stronger"
      - "speak into the microphone, the game transcribes and obeys"
      - "swipe left or right on a phone screen"
      - "choose from a numbered list each turn"
      - "draw a line on the screen to set a path"
      - "hum a note to open the matching door"  # forces: pitch is a key
      - "clap a rhythm, the game repeats it back"
      - "write in a notebook, photograph the page to submit"
      - "arrange physical cards, a camera reads the layout"
      - "press one key, the game picks which action happens"  # wild
      - "hold two keys together to make a chord command"
      - "trace a shape with the mouse, sloppiness is punished"
      - "answer yes or no, no other input exists"
      - "set a slider and watch the result settle"
      - "type a word the game then spells aloud"
      - "roll a die on your phone, the number is the input"
      - "tap along with a metronome to keep a system alive"
      - "whisper, the volume sets how far the action reaches"  # wild
      - "draw a card from a physical deck and type its code"
      - "the game asks a question, you answer with a photograph"  # wild
      - "tilt the device to pour a resource"
      - "blow into the microphone to move air"
      - "keep the mouse perfectly still for ten seconds"
      - "play a two-note tune to swap two objects"
      - "write a haiku, the game counts the syllables"
      - "hold hands with another player to link your inputs"  # wild
      - "leave the game alone, it advances without you"
