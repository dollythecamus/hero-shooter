      - "collect every item on the list"
      - "finish the job with money left over"
      - "keep everyone alive until morning"
      - "solve the puzzle in the fewest moves"
      - "make both sides agree on one number"
      - "deliver every package on time"
      - "score higher than your own last attempt"
      - "win by losing gracefully, points for style"
      - "success is a rumor that reaches every ear"
      - "the goal is to be forgotten by everyone"  # wild
      - "win by making the system run without you"
      - "succeed only when the other player also succeeds"
      - "the score is how few words you needed"
      - "win by being quoted accurately by a stranger"
      - "success is a stable population, not a large one"
      - "finish with nothing left in your inventory"
      - "win by explaining the rules correctly to a judge"
      - "the goal changes each time you name it"  # wild
      - "win by keeping the most honest ledger"
      - "succeed if the garden survives one winter"
