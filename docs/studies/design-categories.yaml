      - "a side view of a cross-section"
      - "a first-person view through a keyhole"
      - "a camera that follows slowly behind you"
      - "split screen showing two places at once"
      - "a distant isometric view of a small town"
      - "a fixed camera in one room only"
      - "a map you draw yourself as you explore"
      - "only the shadows of the world are visible"  # wild
      - "a view from inside a jar on a shelf"
      - "a mirror view, everything appears reversed"
      - "one frame per second, a slideshow"
      - "a telescope view that shows only far things"
      - "the screen is a page of a book you turn"
      - "a thermal view where heat is the only color"  # forces: color encodes temperature
      - "a view from a ceiling fan, rotating slowly"
      - "a window that shows yesterday's state"
      - "everything seen through frosted glass, edges blurred"
      - "a camera mounted on a wandering animal"
      - "a view only available when your eyes are shut"  # wild
      - "a long corridor seen edge-on, compressed flat"
      - "two views stacked, you choose which to trust"
      - "the view is sound, a sonar map drawn in audio"  # wild
      - "seen through a stranger's description, never an image"
      - "a view that scrolls only when you stop looking"
      - "the world seen from the point of a thrown stone"
      - "the view is a punch card you decode"  # heavy
      - "a camera that lags ten seconds behind reality"
      - "the frame is a keyhole cut in a moving wall"
      - "no view at all, only a list of what is near"
  - id: structure-of-space
    name: Structure of space
    forces: "how places are connected and reached"
    items:
      - "a single room with four exits"
      - "a branching corridor that loops back on itself"
      - "a grid of rooms, each one screen"
      - "a circular plaza with an object at its center"
      - "a town with a main street and side alleys"
      - "a building with floors joined by stairs"
      - "a walled garden divided into planting beds"
      - "a maze that rearranges when unobserved"
      - "a space made of seven stacked layers"
      - "rooms that exist only once they are named"
      - "a space defined by sound zones, not walls"  # wild
      - "one long line, everything sits on it"
      - "a space that folds, edges meeting other edges"  # wild
      - "a vertical shaft with platforms on the walls"
      - "a map made of connected paper envelopes"
      - "space as a tree, each choice pruning a branch"
      - "rooms that connect only through shared walls"
      - "a space that grows one new room each day"
      - "a hex grid where each hex is a conversation"
      - "a space with no coordinates, only relations"
      - "a house that is bigger inside each visit"
      - "many doors that all open onto the same hall"
      - "a space made of the player's own memories"  # wild
      - "a space where distance equals time waited"  # heavy
      - "a space that exists only between the objects"
      - "a topology that changes when you count it"  # wild
      - "a space drawn on a rotating turntable"
      - "a space with one dimension and many directions"
      - "a space that is the inside of an instrument"
      - "a map that is also the inventory"
  - id: core-activity
    name: Core activity
    forces: "the repeated verb at the center of play"
    items:
      - "sort objects into the containers they belong in"
      - "match pairs until the board is clear"
      - "arrange a sequence that satisfies a rule"
      - "balance a budget across competing needs"
      - "translate a phrase into a second language"
      - "plant, water, and harvest on a schedule"
      - "cook a dish by following and bending a recipe"
      - "ask questions to narrow one hidden answer"
      - "negotiate a price with a stubborn merchant"
      - "teach a student who learns from your examples"
      - "route trains through a shared network"
      - "write a letter that changes a relationship"
      - "tune an instrument by ear until it locks"
      - "copy a pattern from memory after it hides"
      - "fold a shape until two marks meet"
      - "assign workers to jobs with hidden skills"
      - "trace a rumor through a small village"
      - "hold a line against scheduled waves, rebuild in the lulls"  # heavy
      - "translate between two players who share no words"
      - "archive documents before they expire"
      - "conduct an orchestra of simple repeating loops"
      - "breed two creatures and observe the offspring"
      - "argue with a system that cites its own rules"  # wild
