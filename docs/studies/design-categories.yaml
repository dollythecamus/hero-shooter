      - "the clock is a physical dial that a hand must wind"
      - "turns pass only when the other player guesses you acted"
      - "no clock at all; only the order in which things were remembered"
      - "time runs backward and you unmake a finished week"
      - "the sun moves only when the microphone hears a sound"
      - "every turn is a day, and the game never says how many remain"
      - "you may pause the world, but never yourself"
      - "one player owns the clock and sells minutes to everyone else"  # heavy
