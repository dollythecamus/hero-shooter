# design-categories.yaml - the design-roll option space for the agent-loop jam experiment
#
# Generated 2026-10-24 by three parallel subagents from one spec (20 categories x 30 items, <=14 words,
# behavioural not adjectival, ~8 conventional / 14 unusual / 8 wild per category), then validated here:
# 600 items, 0 duplicates, 0 over-length, pure ASCII.
#
# HOW TO CULL (Chloe): use design-categories.tsv in a spreadsheet. Set the `keep` column to 0, or delete the
# row. Category granularity: delete the whole category block below (and mark it in the TSV) if the dimension
# itself is wrong. Do not rewrite item text - if an item is nearly right, keep it and say so; re-wording is a
# later pass. When the cull is done, the survivors get three annotations each (what it forbids / which gate can
# observe it / cost in block units) and only then does design_roll.py exist (study § 10.3).
#
# flags: wild = feasibility-stressing, heavy = needs more than 2 weeks or an engine feature,
#        forces: ... = what choosing it would force.
#
# A note from the review: input-and-controls is heavily shooter-shaped (19 of 30 items presuppose aim/fire/
# reload) and 5 need hardware the loop does not have (webcam, microphone, foot pedals, head tracking, bite
# sensor). Cull with that in mind if you want the roll to reach non-shooter designs.

categories:
  - id: input-and-controls
    name: Input and control scheme
    forces: "what the player can physically do"
    items:
      - "WASD plus mouse, standard third-person over-shoulder aim and fire"
      - "twin-stick gamepad: left stick moves, right stick aims, triggers fire"
      - "mouse-only pointer control, click to move and click to shoot"
      - "keyboard-only, eight-direction movement with four aim keys"
      - "hold right mouse to aim, left mouse fires, shift dashes"
      - "click-to-move with a queued waypoint path and auto-attack"
      - "one-button control: single key cycles target, holds to fire"
      - "gamepad with aim assist snapping to the nearest visible enemy"
      - "movement typed as rhythm: each step must land on the beat"
      - "aim is a slingshot pull, release to launch a projectile arc"
      - "reload by physically dragging magazines onto a weapon diagram"
      - "controls swap hands every thirty seconds, mirrored layout"  # forces: relearn mid-fight, no muscle memory
      - "aim with head tracking, fire with a bite sensor on a straw"  # heavy
      - "two-stick tank controls, rotate body then rotate turret separately"
      - "shoot by drawing a shape, gesture match decides the weapon"  # wild
      - "stamina-limited verbs: dodge, shoot and jump share one meter"
      - "voice command list of eight shouts, each mapped to an ability"  # heavy
      - "aiming reticle drifts on its own, player counter-steers with mouse"
      - "swap between three characters mid-fight, each with one button"  # forces: no single moveset, three tutorials
      - "melee combos entered as short directional strings like a fighting game"
      - "camera-relative movement disabled: forward is always world north"  # forces: no camera-relative strafing conventions
      - "foot pedals for strafing, hands stay on aim and fire"  # heavy
      - "the controller is a physical dial the player must keep spinning"  # wild
      - "each shot requires solving a two-digit multiplication aloud"  # wild
      - "controls are rebound randomly after every death, layout shown briefly"  # wild
      - "player must keep both triggers held or the weapon overheats"  # wild
      - "aim is controlled by leaning the whole body, camera follows torso"  # heavy
      - "shooting requires drawing breath into a microphone, hold to charge"  # wild
      - "both players share one keyboard half, hands crossing in the middle"  # wild
      - "weapon fire is bound to blinking, tracked by webcam"  # heavy
